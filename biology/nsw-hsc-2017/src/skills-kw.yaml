  # ---- applying the key words in Biology answers ----
  - id: 38
    q: "How does an answer to 'explain' differ from an answer to 'describe'?"
    a: "**Describe** gives characteristics and features: *what* happens. **Explain** relates **cause and effect**: *how* and *why* it happens, linking each step (e.g. 'because…', 'this causes…', 'therefore…')."
    x: "Describe: 'Stomata close in hot, dry conditions.' Explain: 'Guard cells lose water and become flaccid, which closes the stomata, so less water vapour diffuses out and the plant conserves water.'"
    dp: [KW.Explain, KW.Describe]

  - id: 39
    q: "What must an answer to 'evaluate' include?"
    a: "**Criteria** for judging; the **strengths and limitations** (or benefits and costs) measured against them, with evidence; and a clear **final judgement** (e.g. 'highly effective because…')."
    tip: "No judgement means no access to the top marks, however much detail you give."
    dp: [KW.Evaluate]

  - id: 40
    q: "How do 'assess' and 'evaluate' differ in practice?"
    a: "Both require a **judgement**. **Assess**: judge the value, quality, outcomes, results or **size** (how much, how significant). **Evaluate**: judge **against criteria** to determine the value. In both, state the judgement clearly and support it with evidence."
    dp: [KW.Assess, KW.Evaluate]
    tags: [compare]

  - id: 41
    q: "Distinguish 'compare', 'contrast' and 'distinguish' in exam questions."
    a: "**Compare**: show **similarities and differences**. **Contrast**: show **differences** (or opposites) only. **Distinguish**: note what makes one thing **different** from the other."
    tip: "For 'compare', write linked statements ('both…, whereas…') rather than two separate descriptions; a table often works well."
    dp: [KW.Compare, KW.Contrast, KW.Distinguish]
    tags: [compare]

  - id: 42
    q: "What does a 'discuss' question require?"
    a: "**Identify the issues** and give **points for and/or against** (e.g. benefits and drawbacks of a biotechnology), supported with examples. A final judgement isn't strictly required, but a short conclusion helps."
    dp: [KW.Discuss]

  - id: 43
    q: "What does a 'justify' question require?"
    a: "**Support** an argument or conclusion with **evidence and reasons**: say what your position is and why the evidence supports it."
    x: "Example: 'Justify the classification of prions as pathogens' → they cause transmissible disease, as shown by…"
    dp: [KW.Justify]

  - id: 44
    q: "What does an 'analyse' question require in Biology?"
    a: "Break the topic into its **components**, show **how they relate** (cause and effect, interactions), and **draw out the implications**: what follows from those relationships."
    dp: [KW.Analyse]

  - id: 45
    q: "How much detail does 'outline' or 'identify' need compared with 'explain'?"
    a: "**Identify**: recognise and name, often a word or a phrase. **Outline**: the main features in general terms, a sentence or two. **Explain**: the full cause-and-effect reasoning. Use the **marks** as a guide to depth."
    dp: [KW.Outline, KW.Identify]

  - id: 46
    q: "What does a 'predict' question require?"
    a: "**Suggest what is likely to happen** based on the information given, and (for more than one mark) **give the reason**, using the data or biology involved."
    dp: [KW.Predict]

  - id: 47
    q: "How should you answer a 'to what extent' question?"
    a: "Give a **judgement of degree** (e.g. 'largely', 'only partly', 'to a limited extent'), then support it with evidence **for and against**, and return to the judgement at the end."
    x: "'To what extent' is not on NESA's list of key words, but NESA notes that self-explanatory terms like it are used in exam questions; it calls for an assessment of size or degree."
    dp: [KW.Assess]

  - id: 48
    q: "What does 'account for' require, compared with 'give an account of'?"
    a: "**Account for**: give the **reasons** something happens or is the case. **Give an account of**: **narrate** a series of events (a sequence, in order)."
    dp: ["KW.Account for", "KW.Give an account of"]
    tags: [compare]

  - id: 49
    q: "What does 'calculate' require in a Biology exam?"
    a: "Work out a value from the given information, **showing working**, with the **correct unit** and a sensible number of significant figures."
    dp: [KW.Calculate]
