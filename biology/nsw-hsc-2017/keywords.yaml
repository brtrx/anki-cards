# NESA Glossary of key words (HSC), transcribed from
# https://www.nsw.gov.au/education-and-training/nesa/hsc/student-guide/glossary
# (includes NESA's updated wording for "Apply" and "Critically analyse/evaluate").
#
# A card in the key-words deck with `keyword: <Word>` must give this definition
# word for word (list items joined with "; "); tools/verify.py checks it, and
# fails if any key word below has no card.
#
# © NSW Education Standards Authority (NESA), reproduced for non-commercial educational use.

source: "NESA Glossary of key words"
keywords:
  Account for: ["state reasons for, report on."]
  Give an account of: ["narrate a series of events or transactions."]
  Analyse: ["Identify components and the relationship between them.", "Draw out and relate implications."]
  Apply: ["Use in a different, new or unfamiliar situation"]
  Appreciate: ["Make a judgement about the value of."]
  Assess: ["Make a judgement of value, quality, outcomes, results or size."]
  Calculate: ["Ascertain/determine from given facts, figures or information."]
  Clarify: ["Make clear or plain."]
  Classify: ["Arrange or include in classes/categories."]
  Compare: ["Show how things are similar or different."]
  Construct: ["Make.", "Build.", "Put together items or arguments."]
  Contrast: ["Show how things are different or opposite."]
  Critically analyse: ["use interpretation and reasoning to assess a range of evidence and make judgements based on detailed analysis."]
  Critically evaluate: ["add a degree or level of accuracy, knowledge and understanding, logic, questioning, reflection and quality to evaluate."]
  Deduce: ["Draw conclusions."]
  Define: ["State meaning and identify essential qualities."]
  Demonstrate: ["Show by example."]
  Describe: ["Provide characteristics and features."]
  Discuss: ["Identify issues and provide points for and/or against."]
  Distinguish: ["Recognise or note/indicate as being distinct or different from.", "To note differences between."]
  Evaluate: ["Make a judgement based on criteria.", "Determine the value of."]
  Examine: ["Inquire into."]
  Explain: ["Relate cause and effect.", "Make the relationships between things evident.", "Provide why and/or how."]
  Extract: ["Choose relevant and/or appropriate details."]
  Extrapolate: ["Infer from what is known."]
  Identify: ["Recognise and name."]
  Interpret: ["Draw meaning from."]
  Investigate: ["Plan, inquire into and draw conclusions about."]
  Justify: ["Support an argument or conclusion."]
  Outline: ["Sketch in general terms; indicate the main features of."]
  Predict: ["Suggest what may happen based on available information."]
  Propose: ["Put forward (for example a point of view, idea, argument, suggestion) for consideration or action."]
  Recall: ["Present remembered ideas, facts or experiences."]
  Recommend: ["Provide reasons in favour."]
  Recount: ["Retell a series of events."]
  Summarise: ["Express, concisely, the relevant details."]
  Synthesise: ["Putting together various elements to make a whole."]
