# LanguageTool false positives that a human has checked and dismissed.
# grammar_check.py skips any (card id, rule id) pair listed here.
# If you change one of these cards, delete its entries so it is checked again.

ignore:
  - id: 01-003
    rule: FRENCH_WORD_REPEAT_RULE
    reason: "« Tu achètes le pain ou je m'en occupe ? » repeats nothing; spurious match."
  - id: 01-003
    rule: OU
    reason: "« ou » = or (an alternative), which is correct here; « où » would be wrong."
  - id: 03-022
    rule: ACCORD_SUJET_VERBE
    reason: "Lamartine: « Ô temps ! suspends ton vol » — temps is addressed (vocative), suspends is an imperative."
