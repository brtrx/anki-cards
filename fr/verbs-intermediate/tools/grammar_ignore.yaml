  - id: 07-031
    rule: CONSTRUCTION_DANS_LES_EXPRESSIONS
    reason: "« d'ici l'année prochaine » is standard; « d'ici à » is only the more formal variant."
  - id: 08-014
    rule: COND_VS_FUTUR
    reason: "Molière: « que je ne saurais voir » — deliberate literary conditional (= cannot)."
  - id: 12-013
